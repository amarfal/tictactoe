  <main class="hero">
    <h1 class="title">tic tac toe.</h1>

    <ul class="rules">
      <li>the booard is a 3x3 grid (9 spaces total).</li>
      <li>one player uses x, and the other uses o.</li>
      <li>the first player to get their 3 symbols in a row wins.</li>
      <li>if all 9 squares are filled and no one has 3 in a row, the game ends in a tie.</li>
    </ul>
